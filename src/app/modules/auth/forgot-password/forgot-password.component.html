<div class="auth-page">
  <div class="auth-card">
    <a routerLink="/" class="auth-back-home">
      <span aria-hidden="true">←</span> Back to marketplace
    </a>
        <div class="auth-card__logo">
      <img class="brand-logo brand-logo--auth" src="assets/brand/logo-mark.png" width="56" height="56" alt="EquaMeridian Holdings" />
      <span class="logo-text">EquaMeridian Hub</span>
    </div>

    <h2 class="auth-card__title">Reset your password</h2>
    <p class="auth-card__subtitle">
      Enter your email and we'll send a secure reset link.<br/>
      Links expire after 24 hours and are single-use only.
    </p>

    <div class="alert alert--error" *ngIf="dispatchError">
      {{ dispatchError }}
    </div>

    <div class="alert alert--success" *ngIf="sent">
      ✓ Reset link sent. Check your inbox.
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-group">
        <label>Email address <span class="required">*</span></label>
        <input type="email" formControlName="email" placeholder="you@company.com"
               [class.is-invalid]="form.get('email')?.touched && form.get('email')?.invalid" />
        <div class="field-error" *ngIf="form.get('email')?.touched && form.get('email')?.errors?.['required']">
          This is required.
        </div>
        <div class="field-error" *ngIf="form.get('email')?.touched && form.get('email')?.errors?.['email']">
          Please enter a valid email address.
        </div>
      </div>

      <button type="submit" class="btn btn--primary btn--full" [disabled]="loading">
        {{ loading ? 'Sending...' : 'Send Reset Link' }}
      </button>

      <p class="auth-card__footer-link">
        <a routerLink="/auth/login" class="link">← Back to sign in</a>
      </p>
    </form>
  </div>
</div>
