services:
  - type: web
    runtime: static
    name: equameridian-hub
    buildCommand: npm ci && npm run build -- --configuration production
    staticPublishPath: dist/equameridian-hub/browser
    pullRequestPreviewsEnabled: false
    routes:
      # Explicit PayFast return/cancel paths (must serve SPA, not 404)
      - type: rewrite
        source: /payments/*
        destination: /index.html
      # SPA fallback for all other client-side routes
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*.js
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*.css
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache